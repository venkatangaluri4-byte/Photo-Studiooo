name: Install Studio Vault app
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-studio-vault.yml'
      - 'studio-vault-github-vercel-ready.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract application into repo root
        run: |
          set -euo pipefail
          unzip -oq studio-vault-github-vercel-ready.zip -d /tmp/studio-vault-release
          cp -a /tmp/studio-vault-release/studio-vault-template/. .
          test -f package.json
          test -f index.html
          rm -f studio-vault-github-vercel-ready.zip
      - name: Commit application files
        run: |
          git config user.name 'Studio Vault Installer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Install Studio Vault application files'
            git push
          fi
